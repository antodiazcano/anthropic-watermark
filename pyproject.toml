[project]
name = "anthropic-watermark"
version = "0.1.0"
description = "Educational seed and tournament text watermarking with a local language model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.0",
    "torch>=2.5.0",
    "transformers>=4.46.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov src"

[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
