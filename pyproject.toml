[project]
name = "anthropic-watermark"
version = "0.1.0"
description = "An educational, from-scratch reproduction of SynthID-Text-style watermarking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "isort>=8.0.1",
    "mypy>=2.3.1",
    "numpy>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov src"

[tool.coverage.run]
omit = ["src/demo.py"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.flake8]
max-line-length = 88
ignore = ["E203", "W503"]
