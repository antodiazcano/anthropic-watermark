[project]
name = "anthropic-watermark"
version = "0.1.0"
description = "Educational seed and tournament text watermarking with a local language model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "black>=26.5.1",
    "complexipy>=7.0.1",
    "dotenv>=0.9.9",
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "langchain-groq>=1.1.3",
    "numpy>=2.3.0",
    "pydantic>=2.13.4",
    "pylint>=4.0.7",
    "torch>=2.5.0",
    "transformers>=4.46.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[tool.flake8]
max-line-length = 88
ignore = ["E203", "W503"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov src"

[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
